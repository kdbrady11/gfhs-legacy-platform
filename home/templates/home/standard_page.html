{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}

<section class="section">
    <div class="section-narrow">
        <h1>{{ page.title }}</h1>

        {% if page.intro %}
            <p class="lead">{{ page.intro }}</p>
        {% endif %}

        {% if page.body %}
            <div class="lead">
                {{ page.body|richtext }}
            </div>
        {% endif %}
    </div>
</section>

{% endblock %}
